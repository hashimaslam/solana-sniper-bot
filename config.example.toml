# Solana Sniper Bot Configuration
# Copy this file to config.toml and customize

[rpc]
# Solana RPC endpoint (use a private RPC for best performance)
endpoint = "https://api.mainnet-beta.solana.com"
# WebSocket endpoint (optional, defaults to ws version of endpoint)
# ws_endpoint = "wss://api.mainnet-beta.solana.com"
# Commitment level: processed, confirmed, finalized
commitment = "confirmed"
# Request timeout in milliseconds
timeout_ms = 30000

# Optional: Geyser gRPC for lower latency (recommended for production)
# [geyser]
# endpoint = "your-geyser-endpoint:10000"
# token = "your-auth-token"
# tls = true
# Stream commitment: processed is fastest (recommended for sniping)
# commitment = "processed"
# connect_timeout_ms = 10000

[wallet]
# Path to your wallet keypair JSON file
keypair_path = "/path/to/your/keypair.json"
# Additional wallets for parallel execution (optional)
# additional_keypairs = ["/path/to/wallet2.json", "/path/to/wallet3.json"]

[strategy]
# Maximum SOL to spend per snipe
max_buy_sol = 0.1
# Minimum pool liquidity in SOL to trigger snipe
min_liquidity_sol = 1.0
# Maximum pool age in seconds (older pools are ignored)
max_pool_age_secs = 60
# Slippage tolerance (0.15 = 15%)
slippage = 0.15
# Enable pump.fun pool detection
pump_fun_enabled = true
# Enable Raydium pool detection
raydium_enabled = false
# Blacklisted token mints (known rugs/scams)
blacklist = []
# Only snipe from these creators (leave empty to allow all)
creator_whitelist = []

[execution]
# Use Jito bundles for MEV protection
jito_enabled = false
# Jito block engine endpoint
# jito_endpoint = "https://mainnet.block-engine.jito.wtf"
# Priority fee in microlamports (higher = faster inclusion)
priority_fee_microlamports = 100000
# Number of retry attempts
max_retries = 3
# Compute unit limit
compute_unit_limit = 200000
# Simulate transaction before sending
simulate_first = true
# Jito tip per bundle in lamports (min 1000). 1_000_000 = 0.001 SOL
jito_tip_lamports = 1000000
# Optional Jito auth UUID for higher rate limits
# jito_auth_uuid = "your-uuid"
# Race a normal RPC send alongside the bundle
jito_also_send_rpc = false

[position]
# Automatically sell opened positions
enabled = true
# Take profit at +100% (2x) of cost, measured on sellable value
take_profit_pct = 100.0
# Stop loss at -30%
stop_loss_pct = 30.0
# Trailing stop: sell if value drops this % from its peak while in profit (0 = off)
trailing_stop_pct = 0.0
# Force-sell after this many seconds (0 = off)
max_hold_secs = 300
# Re-price open positions every N ms
poll_interval_ms = 1000
# Slippage tolerance for sells
sell_slippage = 0.25
# Sell retries before giving up
max_sell_retries = 3

[logging]
# Log level: trace, debug, info, warn, error
level = "info"
# Log to file (optional)
# file = "sniper.log"
# JSON formatted logs
json = false
