[workspace]
resolver = "2"
members = [
    "crates/sniper-core",
    "crates/sniper-listener",
    "crates/sniper-decoder",
    "crates/sniper-analyzer",
    "crates/sniper-executor",
    "crates/sniper-position",
    "crates/sniper-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hashim <hashimaslam@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/hashimaslam/solana-sniper-bot"

[workspace.dependencies]
# Solana SDK
solana-sdk = "2.2"
solana-client = "2.2"
solana-transaction-status = "2.2"
solana-account-decoder = "2.2"
spl-token = "7.0"
spl-associated-token-account = "6.0"

# Async runtime
tokio = { version = "1.45", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
borsh = "1.5"
bs58 = "0.5"

# gRPC for Geyser
tonic = { version = "0.12", features = ["tls", "tls-native-roots", "gzip"] }
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Misc
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"

# Internal crates
sniper-core = { path = "crates/sniper-core" }
sniper-listener = { path = "crates/sniper-listener" }
sniper-decoder = { path = "crates/sniper-decoder" }
sniper-analyzer = { path = "crates/sniper-analyzer" }
sniper-executor = { path = "crates/sniper-executor" }
sniper-position = { path = "crates/sniper-position" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
